<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 720px; height: 720px; overflow: hidden; }
  body {
    font-family: 'Arial Black', Arial, sans-serif;
    background: #f3f4f6;
    display: flex; align-items: center; justify-content: center;
    border: 8px solid #e5e7eb;
  }
  /* Facebook crops profile pictures to a circle — keep the mark well inside it */
  .mark {
    font-weight: 900;
    font-size: 300px;
    letter-spacing: -12px;
    line-height: 1;
    transform: translateY(-10px);
  }
  .g { color: #111827; }
  .d { color: #4f46e5; }
</style>
</head>
<body>
  <div class="mark"><span class="g">G</span><span class="d">D</span></div>
</body>
</html>
