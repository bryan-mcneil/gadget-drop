  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1640px; height: 624px; overflow: hidden; }
  body {
    font-family: 'Figtree', 'Segoe UI', Arial, sans-serif;
    background: #ffffff;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Subtle dot grid, matching the site's clean gray aesthetic */
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(circle, #e5e7eb 2px, transparent 2px);
    background-size: 36px 36px;
    -webkit-mask-image: radial-gradient(ellipse 75% 90% at 50% 50%, transparent 35%, black 100%);
            mask-image: radial-gradient(ellipse 75% 90% at 50% 50%, transparent 35%, black 100%);
  }
  /* Soft indigo glows in the corners */
  .glow-left, .glow-right {
    position: absolute; width: 560px; height: 560px; border-radius: 50%;
    filter: blur(90px); opacity: 0.10;
  }
  .glow-left  { background: #4f46e5; left: -200px; top: -200px; }
  .glow-right { background: #4f46e5; right: -200px; bottom: -220px; }

  /* All key content stays inside the mobile-safe center zone (~1100px) */
  .content {
    position: relative;
    width: 1100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .brand-row {
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .mark {
    width: 110px; height: 110px;
    background: #f3f4f6;
    border: 2px solid #e5e7eb;
    border-radius: 26px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 58px; letter-spacing: -2px;
    box-shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
  }
  .mark .g { color: #111827; }
  .mark .d { color: #4f46e5; }
  .wordmark {
    font-weight: 800;
    font-size: 116px;
    letter-spacing: -4px;
    color: #111827;
    line-height: 1;
  }
  .wordmark .drop { color: #4f46e5; }
  .tagline {
    margin-top: 30px;
    font-weight: 500;
    font-size: 37px;
    color: #4b5563;
    letter-spacing: -0.5px;
  }
  .tagline strong { font-weight: 600; color: #111827; }
  .pills {
    margin-top: 40px;
    display: flex;
    gap: 18px;
  }
  .pill {
    display: flex; align-items: center; gap: 10px;
    background: #f9fafb;
    border: 1.5px solid #e5e7eb;
    border-radius: 999px;
    padding: 13px 26px;
    font-weight: 600;
    font-size: 24px;
    color: #374151;
  }
  .pill svg { width: 24px; height: 24px; }
  .url {
    margin-top: 42px;
    font-weight: 600;
    font-size: 27px;
    letter-spacing: 0.5px;
    color: #4f46e5;
  }
</style>
</head>

  <div class="dots"></div>
  <div class="glow-left"></div>
  <div class="glow-right"></div>

  <div class="content">
